<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пойдёшь на свидание?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="prefetch" href="plan.html">
<script src="assets/app.js" defer></script>
</head>
<body data-page="ask">
<main class="stage">
  <div class="sheet">
    <span class="sticker sticker--a" aria-hidden="true">одобрено котом в шоке</span>
    <span class="sticker sticker--b" aria-hidden="true">отказ не предусмотрен</span>
    <section class="step" aria-labelledby="askTitle">
      <ol class="progress" aria-label="Шаг 1 из 5">
        <li class="is-current" aria-current="step"></li><li></li><li></li><li></li><li></li>
      </ol>
      <span class="eyebrow">Официальное приглашение</span>
      <h1 id="askTitle"><span id="greeting">Привет, красотка.</span><br>Пойдёшь со мной <span class="hl">на свидание?</span></h1>
      <p class="lead">Вопрос с одним правильным ответом. Второй тоже есть, но он немного стеснительный.</p>
      <div class="ask-row">
        <button class="btn btn--yes" id="yesBtn" type="button">Да 💘</button>
        <span class="no-slot" id="noSlot">
          <button class="btn" id="noBtn" type="button">Нет</button>
        </span>
      </div>
      <p class="taunt" id="taunt" aria-live="polite"></p>
      <p class="hint" id="hint" hidden>Подсказка: правильная кнопка розовая и становится всё больше 👈</p>
    </section>
  </div>
</main>
</body>
</html>
